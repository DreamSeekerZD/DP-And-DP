# 公共配置。数据库连接信息不在这里，放在被 git 忽略的 application-local.yml 中。
# 本地启动：mvn spring-boot:run "-Dspring-boot.run.profiles=local"
server:
#  port: 8081
  port: 8082
  tomcat:
    keep-alive-timeout: 180s
  servlet:
    session:
      # 会话空闲 8 小时到期。注意这是「空闲时长」而不是「绝对登录时长」：
      # 持续操作会不断续期。不持久化会话，应用重启后需要重新登录。
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        path: /
        # 本地是 HTTP，不能设置 secure；将来部署到 HTTPS 必须改为 true。
        secure: false

spring:
  application:
    name: ticket-backend
  jackson:
    # 时间统一按 UTC 输出（OffsetDateTime 序列化成 ...Z），界面再转上海时间展示。
    time-zone: UTC
    serialization:
      # 时间输出为 ISO 8601 字符串，不输出数字时间戳
      write-dates-as-timestamps: false
    deserialization:
      # Spring Boot 默认关闭该开关，这里显式打开：
      # 请求体出现未知字段（例如 publisherId、status、publishedAt）时返回 400，
      # 不允许前端注入本应由服务端决定的字段。
      fail-on-unknown-properties: true
      # Jackson 默认允许把浮点数字静默截断成整数（99.9 -> 99），
      # 截断发生在绑定 Integer 的时候，服务层的范围校验拿到的已经是截断后的值，看不到原始输入。
      # 关闭后，浮点 token 落到 Integer 字段会直接解析失败并返回 400，
      # 99.9 与 99.0 这类整数形式的浮点也一并拒绝，不做四舍五入或强转。
      # 本项目的 JSON 请求体里只有 priceCent 与 totalStock 两个整数业务字段，影响面就是这两项。
      accept-float-as-int: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  # XML 按业务放在 resources/mapper/<业务>/ 下
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # app_user.password_hash -> passwordHash 等下划线到驼峰的映射
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 订单相关的少量配置（B02）。
# 这里只放运行参数，不放任何业务规则；业务规则写在代码里并带中文说明。
ticket:
  order:
    # 订单支付有效期：支付截止时间 = min(下单时间 + 本期限, 演出开始时间)。
    # 默认 300 秒。本地想快速观察超时关闭时，在 application-local.yml 里改短（例如 30s）后重启应用；
    # 已经创建好的订单截止时间不会随配置变化。必须是正数。
    timeout: 300s
    # 超时关闭扫描：fixedDelay 间隔（上一轮结束后再等这么久）与每轮最多处理的订单数。
    timeout-scan-interval: 5s
    timeout-scan-limit: 100
    # 自动调度开关。集成测试设成 false 并直接调用扫描入口，
    # 避免后台线程在断言中途把订单关掉。
    timeout-scan-enabled: true
    # 下单耗时诊断探针（默认关闭，只对指定演出计时，不影响任何业务行为）。
    # 开启后填本轮要定位的演出 ID，应用正常关闭时一次性输出每阶段 count/avg/P95/max。
    diagnostic:
      enabled: false
      performance-id: 0

logging:
  level:
    root: info
    com.zddp.ticket: info
