# 公共配置。数据库连接信息不在这里，放在被 git 忽略的 application-local.yml 中。
# 本地启动：mvn spring-boot:run "-Dspring-boot.run.profiles=local"
server:
  port: 8081
  servlet:
    session:
      # 会话空闲 8 小时到期。注意这是「空闲时长」而不是「绝对登录时长」：
      # 持续操作会不断续期。不持久化会话，应用重启后需要重新登录。
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        path: /
        # 本地是 HTTP，不能设置 secure；将来部署到 HTTPS 必须改为 true。
        secure: false

spring:
  application:
    name: ticket-backend
  jackson:
    # 时间统一按 UTC 输出（OffsetDateTime 序列化成 ...Z），界面再转上海时间展示。
    time-zone: UTC
    serialization:
      # 时间输出为 ISO 8601 字符串，不输出数字时间戳
      write-dates-as-timestamps: false
    deserialization:
      # Spring Boot 默认关闭该开关，这里显式打开：
      # 请求体出现未知字段（例如 publisherId、status、publishedAt）时返回 400，
      # 不允许前端注入本应由服务端决定的字段。
      fail-on-unknown-properties: true
      # Jackson 默认允许把浮点数字静默截断成整数（99.9 -> 99），
      # 截断发生在绑定 Integer 的时候，服务层的范围校验拿到的已经是截断后的值，看不到原始输入。
      # 关闭后，浮点 token 落到 Integer 字段会直接解析失败并返回 400，
      # 99.9 与 99.0 这类整数形式的浮点也一并拒绝，不做四舍五入或强转。
      # 本项目的 JSON 请求体里只有 priceCent 与 totalStock 两个整数业务字段，影响面就是这两项。
      accept-float-as-int: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  # XML 按业务放在 resources/mapper/<业务>/ 下
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # app_user.password_hash -> passwordHash 等下划线到驼峰的映射
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    root: info
    com.zddp.ticket: info
